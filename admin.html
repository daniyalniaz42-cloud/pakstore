<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haroon Electric - Billing System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .invoice-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #004080;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .shop-name {
            font-size: 28px;
            font-weight: bold;
            color: #004080;
        }
        .shop-name span {
            color: #f39c12; /* Electric Gold accent */
        }
        .invoice-title {
            text-align: right;
            font-size: 24px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .details-section {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .details-box {
            width: 48%;
        }
        .details-box h3 {
            margin: 0 0 10px 0;
            color: #004080;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }
        .details-box input {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #004080;
            color: white;
        }
        td input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .totals {
            text-align: right;
            margin-top: 20px;
        }
        .totals p {
            margin: 5px 0;
            font-size: 16px;
        }
        .grand-total {
            font-size: 20px;
            font-weight: bold;
            color: #004080;
            border-top: 2px solid #004080;
            padding-top: 10px;
            margin-top: 10px;
        }
        .btn-group {
            text-align: center;
            margin-top: 30px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 5px;
            transition: 0.3s;
        }
        .btn-add {
            background-color: #27ae60;
            color: white;
        }
        .btn-remove {
            background-color: #e74c3c;
            color: white;
            padding: 5px 10px;
            font-size: 14px;
        }
        .btn-print {
            background-color: #004080;
            color: white;
        }
        button:hover {
            opacity: 0.9;
        }
        
        /* Print Styles (Jab print ya PDF save karein toh buttons hide ho jayenge) */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .invoice-container {
                box-shadow: none;
                padding: 0;
            }
            .btn-group, .btn-remove, .no-print {
                display: none !important;
            }
            input {
                border: none !important;
                padding: 0 !important;
                background: transparent !important;
            }
            th {
                background-color: #004080 !important;
                color: white !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

<div class="invoice-container">
    <div class="header">
        <div class="shop-name">HAROON <span>ELECTRIC</span></div>
        <div class="invoice-title">Invoice</div>
    </div>

    <div class="details-section">
        <div class="details-box">
            <h3>Bill To (Customer):</h3>
            <input type="text" id="custName" placeholder="Customer Name">
            <input type="text" id="custPhone" placeholder="Phone Number">
            <input type="text" id="custAddress" placeholder="Address">
        </div>
        <div class="details-box">
            <h3>Invoice Details:</h3>
            <input type="text" id="invNo" placeholder="Invoice No: #001">
            <input type="date" id="invDate">
            <input type="text" id="invNotes" placeholder="Notes / Payment Terms">
        </div>
    </div>

    <table id="itemsTable">
        <thead>
            <tr>
                <th style="width: 5%;">#</th>
                <th style="width: 45%;">Item Description</th>
                <th style="width: 15%;">Qty</th>
                <th style="width: 20%;">Price</th>
                <th style="width: 15%;">Total</th>
            </tr>
        </thead>
        <tbody>
            <!-- Items yahan add honge -->
        </tbody>
    </table>

    <div class="btn-group no-print">
        <button class="btn-add" onclick="addItem()">+ Add Item</button>
    </div>

    <div class="totals">
        <p>Subtotal: <span id="subtotal">0.00</span> PKR</p>
        <p>Tax (0%): <span id="tax">0.00</span> PKR</p>
        <p class="grand-total">Grand Total: <span id="grandTotal">0.00</span> PKR</p>
    </div>

    <div class="btn-group no-print">
        <button class="btn-print" onclick="window.print()">Print / Save PDF</button>
    </div>
</div>

<script>
    let rowCount = 0;

    function addItem() {
        rowCount++;
        const tbody = document.querySelector('#itemsTable tbody');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${rowCount}</td>
            <td><input type="text" placeholder="Item name (e.g., Wire, Switch)"></td>
            <td><input type="number" class="qty" value="1" min="1" oninput="calculateTotals()"></td>
            <td><input type="number" class="price" value="0" min="0" oninput="calculateTotals()"></td>
            <td class="row-total">0.00</td>
            <td class="no-print"><button class="btn-remove" onclick="removeItem(this)">X</button></td>
        `;
        tbody.appendChild(row);
        calculateTotals();
    }

    function removeItem(btn) {
        btn.closest('tr').remove();
        rowCount--;
        // Dobara number set karna
        const rows = document.querySelectorAll('#itemsTable tbody tr');
        rows.forEach((row, index) => {
            row.cells[0].innerText = index + 1;
        });
        calculateTotals();
    }

    function calculateTotals() {
        let subtotal = 0;
        const rows = document.querySelectorAll('#itemsTable tbody tr');
        rows.forEach(row => {
            const qty = parseFloat(row.querySelector('.qty').value) || 0;
            const price = parseFloat(row.querySelector('.price').value) || 0;
            const total = qty * price;
            row.querySelector('.row-total').innerText = total.toFixed(2);
            subtotal += total;
        });
        
        document.getElementById('subtotal').innerText = subtotal.toFixed(2);
        document.getElementById('tax').innerText = '0.00'; 
        document.getElementById('grandTotal').innerText = subtotal.toFixed(2);
    }

    // Aaj ki date by-default set karna
    document.getElementById('invDate').valueAsDate = new Date();
    
    // Shuru mein ek row add karna
    addItem();
</script>

</body>
</html>
